name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Install Hugging Face Hub
        run: pip install huggingface_hub
        
      - name: Push via HF CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: huggingface-cli upload SujalDixit1927/Deepfake-Detection-System . . --repo-type space --token $HF_TOKEN
